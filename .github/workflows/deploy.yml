name: Deploy to CSC Pouta

on:
  push:
    branches:
      - main  # Käynnistyy automaattisesti aina kun main-haaraan pushataan

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH through GitHub Actions and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/Web-ohjelmoinnin-sovellusprojekti
            git pull origin main
            docker compose up -d --build